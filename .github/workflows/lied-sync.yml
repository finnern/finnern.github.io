name: Lied-Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lied-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lied-Ziele aus Sheet holen
        run: python3 scripts/lied_sync.py

      - name: Committen, falls geändert
        run: |
          if git diff --quiet -- lied/; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lied/
          git commit -m "Lied-Ziele aus Sheet aktualisiert"
          git push
